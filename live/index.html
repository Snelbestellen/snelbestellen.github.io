<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://ntfy.sh; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bestellingen">
<title>Bestellingen live</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../icoon-180.png">
<style>
  :root { --bg:#0d0f14; --bg2:#151922; --card:#1a1f2a; --rand:#272e3c; --tekst:#f2f4f8; --zacht:#9aa3b2; --groen:#25d366; --accent:#7c5cff; --oranje:#ffb020; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tekst); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom); }
  header { position:sticky; top:0; z-index:5; background:rgba(13,15,20,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--rand); padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; gap:10px; }
  header img { width:30px; height:30px; border-radius:8px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  .status { font-size:13px; color:var(--zacht); display:flex; align-items:center; gap:6px; }
  .status::before { content:""; width:9px; height:9px; border-radius:50%; background:#666; }
  .status.aan::before { background:var(--groen); box-shadow:0 0 0 4px rgba(37,211,102,.18); }
  .status.uit::before { background:#ff5c7a; }
  main { max-width:640px; margin:0 auto; padding:14px 16px 40px; }
  .filters { display:flex; gap:8px; margin-bottom:12px; }
  .filters button { flex:1; padding:9px; border-radius:10px; border:1px solid var(--rand); background:var(--bg2); color:var(--tekst); font:inherit; font-size:14px; }
  .filters button.aan { background:var(--accent); border-color:var(--accent); font-weight:600; }
  .kaart { background:var(--card); border:1px solid var(--rand); border-radius:16px; padding:14px 16px; margin-bottom:10px; }
  .kaart.nieuw { border-color:var(--groen); box-shadow:0 0 0 3px rgba(37,211,102,.15); }
  .kaart.klaar { opacity:.55; }
  .rij { display:flex; align-items:center; gap:8px; }
  .code { font:600 13px ui-monospace,Consolas,monospace; background:rgba(37,211,102,.14); color:var(--groen); padding:2px 8px; border-radius:6px; }
  .tijd { margin-left:auto; font-size:13px; color:var(--zacht); }
  .wat { font-size:17px; font-weight:700; margin:8px 0 2px; }
  .wie { color:var(--zacht); font-size:15px; }
  .acties { display:flex; gap:8px; margin-top:12px; }
  .acties button { flex:1; padding:10px; border-radius:10px; border:1px solid var(--rand); background:var(--bg2); color:var(--tekst); font:inherit; font-size:14px; }
  .acties button.klaar { background:rgba(37,211,102,.14); border-color:transparent; color:var(--groen); font-weight:600; }
  .acties button.weg { flex:0 0 48px; color:#ff5c7a; }
  .leeg, .uitleg { text-align:center; color:var(--zacht); padding:40px 10px; }
  .uitleg h2 { color:var(--tekst); }
  .tip { font-size:13px; color:var(--zacht); text-align:center; margin-top:18px; }
  #toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#fff; color:#111; padding:10px 16px; border-radius:12px; font-size:14px; font-weight:600; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <img src="../favicon.png" alt="">
  <h1>Bestellingen live</h1>
  <span class="status" id="status">Verbinden...</span>
</header>
<main id="main"></main>
<div id="toast"></div>
<script src="live.js?v=5"></script>
</body>
</html>
